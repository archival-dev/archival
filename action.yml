# A github action for building and publishing archival sites.
#
# On the default branch the site is built and deployed by archival's servers,
# and this run waits for it: it goes green only once the site is live. Any
# other branch is built here, so a broken site still fails the check.
name: Archival
author: "Archival Team"
description: "Builds and publishes an archival site"
branding:
  icon: "archive"
  color: "green"
inputs:
  archival-bin:
    description:
      A path to an archival binary to validate non-default branches with. If
      not provided, will run the version from Cargo.toml.
    required: false
  archival-version:
    description:
      Override the archival version non-default branches are validated with. If
      archival-bin is specified, this does nothing.
    required: false
    default: "0.22.2"
  api-host:
    description: "API Host to send build events to"
    required: false
    default: "https://api.archival.dev"
  github-token:
    description:
      A token that can read this repo, which is how archival knows the build
      request came from it.
    required: false
    default: ${{ github.token }}
  timeout-minutes:
    description: "How long to wait for the site to go live"
    required: false
    default: "30"
runs:
  using: "composite"
  steps:
    - name: Build and Deploy
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      shell: bash
      env:
        ARCHIVAL_API_HOST: ${{ inputs.api-host }}
        ARCHIVAL_GITHUB_TOKEN: ${{ inputs.github-token }}
        ARCHIVAL_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: node "${{ github.action_path }}/action/deploy.mjs"
    - name: Checkout
      if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/checkout@v4
    - name: Setup Node
      if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/setup-node@v4
    - name: Install Archival
      if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && inputs.archival-bin == '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.archival-version }}
      run: |
        set -euo pipefail
        dir="archival-v${VERSION}-x86_64-unknown-linux-musl"
        base="https://github.com/archival-dev/archival/releases/download/v${VERSION}"
        cd "$(mktemp -d)"
        curl -fsSL --retry 3 -O "$base/$dir.tar.gz"
        echo "$(curl -fsSL "$base/$dir.tar.gz.sha256")  $dir.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar xzf "$dir.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "$dir/archival"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Archival Prebuild
      if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: ${{ inputs.archival-bin || 'archival' }} prebuild
      shell: bash
    - name: Build with Archival
      if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: ${{ inputs.archival-bin || 'archival' }} build
      shell: bash
