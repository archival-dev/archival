[package]
name = "archival"
version = "0.20.2"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The simplest CMS in existence"
repository = "https://github.com/archival-dev/archival"

# Release assets are named archival-v{version}-{target}.tar.gz (the `v` is part of
# both the tag and the file name), and the binary sits one directory deep inside the
# tarball - see .github/scripts/package.sh. Linux builds are musl-only, which is fine:
# binstall probes for glibc and falls back from -gnu to -musl automatically.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[lib]
name = "archival"
path = "src/lib.rs"

[features]
default = ["binary", "import-csv", "json-schema", "lsp"]
dhat-heap = ["dep:dhat"]
gen-traces = ["binary", "dep:tracing-chrome"]
typescript = ["dep:typescript-type-def"]
proto = ["dep:prost", "dep:prost-build"]
binary = [
    "stdlib-fs",
    "dep:ctrlc",
    "dep:tracing-subscriber",
    "dep:tiny_http",
    "dep:clap",
    "dep:console",
    "dep:nanoid",
    "dep:indicatif",
    "dep:reqwest",
    "dep:home",
    "dep:rsa",
    "dep:rand",
    "dep:base64",
    "json-schema",
]
import-csv = ["dep:csv"]
json-schema = []
carriers = ["binary"]
lsp = ["binary", "dep:lsp-server", "dep:lsp-types"]
stdlib-fs = ["dep:notify", "dep:walkdir"]
verbose-logging = []
backtrace = ["anyhow/backtrace"]

[[bin]]
name = "archival"
path = "src/main.rs"

[[bench]]
name = "build"
harness = false

[profile.release]
# debug = true
codegen-units = 1
lto = false
# With codegen-units = 1, opt-level 3 produces a binary that is both faster
# (~12% on build benchmarks) and smaller than opt-level "s".
opt-level = 3

[dependencies]
# profiling
dhat = { version = "0.3.3", optional = true }
tracing-chrome = { version = "0.7.2", optional = true }
# lsp
lsp-server = { version = "0.7", optional = true }
# 0.96 swapped `url::Url` for fluent-uri's `Uri`, which cannot convert to or
# from a file path.
lsp-types = { version = "0.95", optional = true }
# binary
ctrlc = { version = "3.4.2", optional = true }
tracing-subscriber = { version = "0.3.18", features = [
    "env-filter",
], optional = true }
tiny_http = { version = "0.12.0", optional = true }
clap = { version = "4.5.1", optional = true, features = ["cargo", "derive"] }
console = { version = "0.16.1", optional = true }
nanoid = { version = "0.4.0", optional = true }
indicatif = { version = "0.18", optional = true }
reqwest = { version = "0.12", features = [
    "blocking",
    "rustls-tls",
    "json",
], default-features = false, optional = true }
serde_json = { version = "1.0.113" }
home = { version = "0.5.9", optional = true }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
rand = { version = "0.8.5", optional = true }
base64 = { version = "0.22.0", optional = true }
# stdlib-fs
walkdir = { version = "2.3.3", optional = true }
notify = { version = "8.2", optional = true }
futures = { version = "0.3.30", features = ["executor"] }
# typescript
typescript-type-def = { version = "0.5.9", optional = true }
# import-csv
csv = { version = "1.3.0", optional = true }
# proto
prost = { version = "0.14.1", optional = true }
# shared
liquid = "0.26.1"
serde = { version = "1.0.152", features = ["rc"] }
toml = { version = "1.1", features = ["display", "preserve_order"] }
# Comments are dropped by `toml`'s value model, so object definitions are
# parsed a second time with toml_edit to recover the field descriptions.
toml_edit = { version = "0.25", default-features = false, features = [
    "parse",
    "display",
] }
comrak = "0.41"
liquid-core = "0.26.4"
liquid-lib = { version = "0.26.4", features = ["shopify", "extra"] }
regex = "1.10.2"
thiserror = "2.0"
anyhow = "1.0"
zip = { version = "4.5", default-features = false, features = ["deflate"] }
toml_datetime = "1.1"
tracing = "0.1.37"
time = { version = "0.3.36", features = ["local-offset", "formatting"] }
semver = "1.0.22"
once_cell = "1.19.0"
data-encoding = "2.5.0"
mime_guess = { version = "2" }
sha2 = "0.10.8"
seahash = "4.1.0"
indefinite = "0.1.9"
pluralizer = "0.5.0"
urlencoding = "2.1.3"
ordermap = { version = "1.0.0", features = ["serde"] }
assertables = "9.8.6"
ignore = "0.4.25"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
serde_json = "1.0.113"
tempfile = "3.5.0"
tracing-test = "0.2.4"
wasm-bindgen-test = "0.3.0"
jsonschema = "0.26.1"
pretty_assertions = "1.4.1"
lazy_static = "1.5.0"
assertables = "9.8.6"

[build-dependencies]
prost-build = { version = "0.14.1", optional = true }
